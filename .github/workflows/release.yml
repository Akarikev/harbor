name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            librsvg2-dev \
            patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: bun install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: harbor ${{ github.ref_name }}
          releaseBody: |
            See [CHANGELOG.md](https://github.com/Akarikev/harbor/blob/main/CHANGELOG.md) for details.

            **Downloads**
            - AppImage (recommended): portable, no install required
            - `.deb` for Debian/Ubuntu
            - `.rpm` for Fedora/RHEL

            Verify downloads with `SHA256SUMS`.
          releaseDraft: false
          prerelease: false
          args: --target x86_64-unknown-linux-gnu

      - name: Generate SHA256SUMS
        run: |
          cd src-tauri/target/release/bundle
          find . -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            src-tauri/target/release/bundle/SHA256SUMS \
            --repo "${{ github.repository }}" \
            --clobber

[package]
name = "harbor"
version = "0.1.0"
description = "See every dev server running on localhost from your system tray"
authors = ["Akarikev"]
license = "MIT"
repository = "https://github.com/Akarikev/harbor"
homepage = "https://github.com/Akarikev/harbor"
edition = "2021"

[lib]
name = "harbor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-single-instance = "=2.4.5"
gtk = "0.18"
gtk-layer-shell = { version = "0.8.2", features = ["v0_6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
ksni = "0.3.7"

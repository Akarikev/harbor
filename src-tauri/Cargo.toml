[package]
name = "harbor"
version = "0.3.1"
description = "See every dev server running on localhost from your system tray"
authors = ["Akarikev"]
license = "MIT"
repository = "https://github.com/Akarikev/harbor"
edition = "2021"

[lib]
name = "harbor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-single-instance = "=2.4.5"
gtk = "0.18"
gtk-layer-shell = { version = "0.8.2", features = ["v0_6"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
ksni = "0.3.7"
# Already in the tree via ksni; declared for the GNOME extension D-Bus service.
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-lite = { version = "2", default-features = false, features = ["std"] }
gdkwayland-sys = "0.18"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }

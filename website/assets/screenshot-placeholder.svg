<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-label="Screenshot placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f5ef"/>
      <stop offset="100%" stop-color="#f3efe7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,0,0,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#grid)"/>
  <rect x="80" y="60" width="1040" height="630" rx="12" fill="#fff" stroke="rgba(0,0,0,0.08)" stroke-width="1"/>
  <rect x="120" y="120" width="960" height="540" rx="8" fill="#f8f5ef" stroke="rgba(0,0,0,0.06)" stroke-width="1" stroke-dasharray="8 6"/>
  <text x="600" y="370" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="600" fill="rgba(0,0,0,0.35)">Screenshot placeholder</text>
  <text x="600" y="410" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="15" fill="rgba(0,0,0,0.28)">Replace with website/assets/screenshot.png</text>
</svg>

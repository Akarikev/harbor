<!doctype html>
<html lang="en" data-theme-mode="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Harbor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="header" class="bar">
        <div class="heading">
          <button id="settings-back" class="icon-button" type="button" title="Back to ports" aria-label="Back to ports" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
          </button>
          <h1 id="app-title">harbor</h1>
        </div>
        <label class="toggle-container" id="quick-show-all" title="Show all ports including system services">
          <span>Show all</span>
          <input class="switch" type="checkbox" id="show-all-toggle" role="switch" />
        </label>
      </header>

      <main id="viewport" tabindex="-1">
        <section id="ports-view" aria-label="Listening ports">
          <div id="port-list"></div>
          <p id="empty-state" class="status-message" role="status" hidden>No servers running</p>
          <div id="loading-state" class="status-message" role="status">
            <span class="spinner" aria-hidden="true"></span> Scanning ports…
          </div>
        </section>

        <section id="settings-view" aria-label="Settings" hidden>
          <section class="settings-section" aria-labelledby="general-title">
            <h2 id="general-title">General</h2>
            <label class="settings-row" for="show-all-settings">Show all ports
              <input class="switch" type="checkbox" id="show-all-settings" role="switch" />
            </label>
            <label class="settings-row" for="autostart-toggle">Start at login
              <input class="switch" type="checkbox" id="autostart-toggle" role="switch" />
            </label>
            <label class="settings-row" for="refresh-select">Refresh interval
              <select id="refresh-select">
                <option value="2000">Every 2 seconds</option>
                <option value="5000">Every 5 seconds</option>
                <option value="10000">Every 10 seconds</option>
                <option value="30000">Every 30 seconds</option>
                <option value="0">Off</option>
              </select>
            </label>
          </section>
          <section class="settings-section" aria-labelledby="killing-title">
            <h2 id="killing-title">Killing</h2>
            <label class="settings-row" for="confirm-kill-toggle">Confirm before kill
              <input class="switch" type="checkbox" id="confirm-kill-toggle" role="switch" />
            </label>
            <label class="settings-row" for="kill-action-select">Default kill action
              <select id="kill-action-select">
                <option value="soft">Soft (SIGTERM)</option>
                <option value="force">Force (SIGKILL)</option>
              </select>
            </label>
          </section>
          <section class="settings-section" aria-labelledby="appearance-title">
            <h2 id="appearance-title">Appearance</h2>
            <label class="settings-row" for="theme-select">Theme
              <select id="theme-select">
                <option value="system">Follow system</option>
                <option value="light">Light</option>
                <option value="dark">Dark</option>
              </select>
            </label>
          </section>
          <section class="settings-section" id="gnome-section" aria-labelledby="gnome-title" hidden>
            <h2 id="gnome-title">GNOME</h2>
            <div class="settings-row">
              <span>Top-bar button
                <small id="gnome-status" class="settings-note"></small>
              </span>
              <button id="gnome-enable" class="pill-button" type="button">Enable</button>
            </div>
          </section>
        </section>
      </main>

      <footer id="footer" class="bar">
        <button id="settings-btn" class="text-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06A1.65 1.65 0 0 0 15 21a2 2 0 0 1-6 0 1.65 1.65 0 0 0-1.82-.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 3 15a2 2 0 0 1 0-6 1.65 1.65 0 0 0 .33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 3a2 2 0 0 1 6 0 1.65 1.65 0 0 0 1.82.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 21 9a2 2 0 0 1 0 6z"/></svg>
          Settings
        </button>
        <button id="quit-btn" class="text-button" type="button" title="Quit harbor">Quit</button>
      </footer>

      <div id="toast" role="status" hidden></div>
    </div>
    <script src="main.js" defer></script>
  </body>
</html>
